<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn" crossorigin="anonymous">
    <!-- FUENTE DE ICONOS -->
    <script src="https://kit.fontawesome.com/c1e6ca8ee2.js" crossorigin="anonymous"></script>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="/socket.io/socket.io.js" charset="utf-8"></script>
    <script src="/js/main.js" charset="utf-8"></script>
    <title>Chat JavaScript</title>
</head>
<body>
    
    <nav class="navbar navbar-light bg-warning">
        <a class="navbar-brand mx-auto" href="/">Bienvenido al Chat - Recibiendo las sugerencias</a>
    </nav>

    <div class="card col-md-4 mt-5 mx-auto" id="nickWrap">
        <div class="card-header">
            <h2>Ingresa tu Nombre de Usuario</h2>
        </div>
        <p id="nickError"></p>
        <div class="card-body">
            <form id="nickform">
                <input type="text" id="nickName" class="form-control">
                <button type="submit" class="btn btn-dark mt-2">
                    <i class="fa-solid fa-reply"></i> Ingresar</button>
            </form>
        </div>
    </div>

    <div class="container" id="contentWrap">
        <div class="row">
        <div class="col-md-6 offset-md-1 mt-4">
            <div class="card">
                <div class="card-header">
                    <h3>Chatiemos</h3>
                </div>

                <div id="chat" class="card-body"></div>
                <form id="message-form" class="card-footer">
                    <div class="input-group">
                        <input type="text" id="message" class="form-control">
                        <div class="input-group-append">
                        <button type="submit" class="btn btn-dark">
                            <i class="fa-solid fa-reply"></i> Enviar</button>
                    </div>
                    </div>
                    
                </form>
            </div>
        </div>

        <div class="card col-md-3">
            <div class="card-header">
                <h3>Usuarios Conectados</h3>
            </div>

            <div class="card-body">
                <div id="usernames"></div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
