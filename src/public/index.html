<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="/img/icon.chat.svg" type="image/x-icon">
    <title>Chat JavaScript</title>
    <!-- FUENTE DE ICONOS -->
    <script src="https://kit.fontawesome.com/c1e6ca8ee2.js" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="/socket.io/socket.io.js" charset="utf-8"></script>
    <script src="/js/main.js" charset="utf-8"></script>
</head>
<body onload="mostrarChat()">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="/">
            <img src="/img/icon.chat.svg" alt="">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Dropdown
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="#">Action</a></li>
                  <li><a class="dropdown-item" href="#">Another action</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Disabled</a>
              </li>
            </ul>
            <form class="d-flex">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
    </nav>

    <div class="container bg-light mt-5" id="contentForm">
      <div class="row">
        <form>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>

    <div class="container" id="contentChat">
        <div class="row">
            <div class="card col-md-4 mt-5 mx-auto" id="nickWrap">
                <div class="card-header">
                    <h2>Bienvenido al Chat - Recibiendo las sugerencias</h2>
                </div>
                <p id="nickError"></p>
                <div class="card-body">
                    <form id="nickform">
                        <input type="text" id="nickName" class="form-control" placeholder="Ingresa tu Nombre de Usuario" required>
                        <button type="submit" class="btn btn-dark mt-2">
                            <i class="fa fa-sign-in"></i> Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <div class="container" id="contentWrap">
        <div class="row">
        <div class="col-md-6 offset-md-1 mt-4">
            <div class="card">
                <div class="card-header">
                    <h3>Chatiemos</h3>
                </div>

                <div id="chat" class="card-body"></div>
                <form id="message-form" class="card-footer">
                    <div class="input-group">
                        <input type="text" id="message" class="form-control" placeholder="Mensaje" required>
                        <div class="input-group-append">
                        <button type="submit" class="btn btn-dark">
                            Enviar <i class="fa fa-paper-plane" aria-hidden="true"></i></button>
                    </div>
                    </div>
                    
                </form>
            </div>
        </div>

        <div class="card col-md-3">
            <div class="card-header">
                <h3>Usuarios Conectados</h3>
            </div>

            <div class="card-body">
                <div id="usernames"></div>
            </div>
        </div>
    </div>

    </div>

    <div class="container">
      <div class="row">
        <div id="saludo" class="text-center mb-5 mt-5">
          <img name="tiempo">
          <div id="txtsaludo" class="title-saludo"></div>
        </div>
      </div>
    </div>



    <script>
      function mostrarChat() {
        fecha = new Date();
        hora = fecha.getHours();

        if(hora >= 0 && hora < 6) { // Este muestra el formulario
          texto = "Buenas madrugadas";
          imagen = "/img/madrugada.jpg";
          document.getElementById('contentForm').classList.add('d-block');
        }

        if(hora >= 6 && hora < 12) { // Este muestra el chat
          texto = "Buenos días";
          imagen = "/img/manana.jpg";
          document.getElementById('contentForm').classList.add('d-block');
        }

        if(hora >= 12 && hora < 18) { // Este muestra el formulario
          texto = "Buenas tardes";
          imagen = "/img/tarde.jpg";
          document.getElementById('contentChat').classList.add('d-block');
        }

        if(hora >= 18 && hora < 0) { // Este muestra el chat
          texto = "Buenas noches";
          imagen = "/img/noche.jpg";
          document.getElementById('contentChat').classList.add('d-block');
        }

        document.images["tiempo"].src = imagen;

        document.getElementById('txtsaludo').innerHTML = texto;

      }
    </script>

</body>
</html>
