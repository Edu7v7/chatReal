    <div class="container container-primary">

      <div class="container">
        <div class="row">
          <div id="saludo" class="text-center mt-5">
            <img name="tiempo" class="w-100">
            <h1 id="txtsaludo" class="title-saludo mt-5"></h1>
          </div>

      <div class="container content-form bg-light mt-5" id="contentForm">
        <div class="row">
          <form class="my-4">
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Email address</label>
              <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
              <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
  
      <div class="container content-chat" id="contentChat">
          <div class="row">
              <div class="card col-md-4 mt-5 mx-auto" id="nickWrap">
                  <div class="card-header">
                      <h5 class="text-center">Bienvenido al Chat de radio, Familia Punto Com</h5>
                  </div>
                  <p id="nickError"></p>
                  <div class="card-body">
                      <form id="nickform" class="text-center">
                          <input type="text" id="nickName" class="form-control" placeholder="Ingresa tu nombre para conversar" required>
                          <button type="submit" class="btn btn-dark mt-4">
                              <i class="fa fa-sign-in"></i> Ingresar</button>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  
  
      <div class="container" id="contentWrap">
        <div class="row">
          <div class="col-md-8 mt-4">
            <div class="card">
                <div class="card-header">
                    <h3>Tema del día: Ciber delincuencia</h3>
                </div>

                <div id="chat" class="card-body"></div>
                <form id="message-form" class="card-footer">
                    <div class="input-group">
                        <input type="text" id="message" class="form-control" placeholder="Mensaje" required>
                        <div class="input-group-append">
                        <button type="submit" class="btn btn-dark">
                            Enviar <i class="fa fa-paper-plane" aria-hidden="true"></i></button>
                    </div>
                    </div>
                    
                </form>
            </div>
        </div>
            <div class="card col-md-4 mt-4">
                <div class="card-header">
                    <h3>Usuarios Conectados</h3>
                </div>
    
                <div class="card-body">
                    <div id="usernames"></div>
                </div>
            </div>
          
  
      </div>
  
      </div>
  
      

    </div>



    <script>
      function mostrarChat() {
        fecha = new Date();
        hora = fecha.getHours();

        
        if(hora >= 0 && hora < 6) { // Este muestra el formulario
          texto = "Buenas madrugadas";
          imagen = "/img/madrugada.jpg";
          document.getElementById('contentChat').classList.add('d-block');
        }

        if(hora >= 6 && hora < 10) { // Este muestra el chat
          texto = "Tema del dia - Ciber Delicuencia";
          imagen = "/img/bg-primary.jpg";
          document.getElementById('contentChat').classList.add('d-block');
        }

        if(hora >= 10 && hora < 18) { // Este muestra el formulario
          texto = "Buenas tardes";
          imagen = "/img/tarde.jpg";
          document.getElementById('contentForm').classList.add('d-block');
        }

        if(hora >= 18 && hora < 22) { // Este muestra el chat
          texto = "Buenas noches";
          imagen = "/img/noche.jpg";
          document.getElementById('contentForm').classList.add('d-block');
        }


        document.images["tiempo"].src = imagen;

        document.getElementById('txtsaludo').innerHTML = texto;

      }
    </script>
